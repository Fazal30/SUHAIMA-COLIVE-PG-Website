<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="30%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#DAA520" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0A0C10" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="64" height="64" rx="18" fill="url(#darkBg)" />
  <rect width="62" height="62" x="1" y="1" rx="17" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Crown / Dome Top -->
  <path d="M32 9 L34 13 L30 13 Z" fill="url(#goldGrad)" />
  <path d="M26 14 C26 12 38 12 38 14 L41 17 C38 18 26 18 23 17 Z" fill="url(#goldGrad)" />

  <!-- Architectural Buildings Background (inside S) -->
  <path d="M29 20 L35 20 L35 34 L29 34 Z" fill="url(#goldGrad)" opacity="0.35" />
  <path d="M35 24 L40 24 L40 38 L35 38 Z" fill="url(#goldGrad)" opacity="0.25" />
  <path d="M24 26 L29 26 L29 42 L24 42 Z" fill="url(#goldGrad)" opacity="0.25" />

  <!-- Geometric Luxury "S" Monogram -->
  <path d="M41 22 C37 19 26 19 23 24 C20 28 22 33 28 35 L36 38 C42 40 44 45 41 50 C38 55 27 55 22 52 L21 47 C25 50 35 51 37 46 C39 42 37 39 32 37 L25 34 C19 32 17 26 21 21 C25 15 37 15 42 18 Z" 
        fill="url(#goldGrad)" 
        filter="url(#goldGlow)" />

  <!-- Foundation Pillar / Co-living Base -->
  <rect x="22" y="53.5" width="20" height="2" rx="1" fill="url(#goldGrad)" opacity="0.8" />
</svg>